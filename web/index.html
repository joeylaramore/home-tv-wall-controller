<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101827"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/icon.svg" type="image/svg+xml"><title>Roku Wall</title><link rel="stylesheet" href="/style.css"></head>
<body><main><header><div><span class="eyebrow">ROKU TV WALL</span><h1>Roku Wall</h1></div><span class="mark" aria-hidden="true">▦</span></header><section class="group" aria-label="All TVs"><button class="on" data-target="all" data-action="on">All on</button><button class="off" data-target="all" data-action="off">All off</button></section><section class="scenes" id="scenes" aria-label="Scenes" hidden></section><section class="game-picker" id="game-picker" aria-label="Live games"><button id="find-games">Find live Sunday Ticket games</button><div id="games" hidden></div><button id="play-games" class="on" hidden>Play selected games</button></section><section class="layout-tools" aria-label="Wall layout"><button id="edit-layout" hidden>Edit layout</button><button class="on" id="save-layout" hidden>Save layout</button></section><section class="layout-tools" aria-label="Configuration backup"><button id="backup-config">Backup Configuration</button><button id="restore-config">Restore Configuration</button><input id="restore-file" type="file" accept="application/json,.json" aria-label="Configuration backup file" hidden></section><section class="setup" id="setup" hidden><h2>Find TVs</h2><p>Discover every Roku TV on this network, then choose which ones belong in this wall.</p><button id="discover">Discover TVs</button><div id="discovered"></div><button class="on" id="save" hidden>Save TV wall</button></section><section class="grid" id="grid" aria-label="Individual TVs"></section><section class="remote-panel" id="remote-panel" hidden><div class="remote-header"><h2 id="remote-title">Remote</h2><button id="close-remote" aria-label="Close remote">Close</button></div><div class="remote-grid"><button data-remote="Home">Home</button><button data-remote="Back">Back</button><button data-remote="Up">?</button><button data-remote="Left">?</button><button data-remote="Select">OK</button><button data-remote="Right">?</button><button data-remote="Down">?</button><button data-remote="Play">Play/Pause</button><button data-remote="InstantReplay">Replay</button><button data-remote="VolumeDown">Vol ?</button><button data-remote="VolumeMute">Mute</button><button data-remote="VolumeUp">Vol +</button></div><div class="remote-inputs"><button data-remote="InputHDMI1">ARC / HDMI 1</button><button data-remote="InputHDMI2">HDMI 2</button><button data-remote="InputHDMI3">HDMI 3</button><button data-remote="InputHDMI4">HDMI 4</button></div></section><p class="message" id="message" role="status" aria-live="polite">Connect to your local controller to begin.</p></main><script src="/app.js" defer></script></body></html>
