<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101827"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/icon.svg" type="image/svg+xml"><title>Roku Wall</title><link rel="stylesheet" href="/style.css"></head>
<body><main><header><div><span class="eyebrow">ROKU TV WALL</span><h1>Roku Wall</h1></div><span class="mark" aria-hidden="true">▦</span></header><section class="group" aria-label="All TVs"><button class="on" data-target="all" data-action="on">All on</button><button class="off" data-target="all" data-action="off">All off</button></section><section class="layout-tools" aria-label="Wall layout"><button id="edit-layout" hidden>Edit layout</button><button class="on" id="save-layout" hidden>Save layout</button></section><section class="layout-tools" aria-label="Configuration backup"><button id="backup-config">Backup Configuration</button><button id="restore-config">Restore Configuration</button><input id="restore-file" type="file" accept="application/json,.json" aria-label="Configuration backup file" hidden></section><section class="setup" id="setup" hidden><h2>Find TVs</h2><p>Discover every Roku TV on this network, then choose which ones belong in this wall.</p><button id="discover">Discover TVs</button><div id="discovered"></div><button class="on" id="save" hidden>Save TV wall</button></section><section class="grid" id="grid" aria-label="Individual TVs"></section><p class="message" id="message" role="status" aria-live="polite">Connect to your local controller to begin.</p></main><script src="/app.js" defer></script></body></html>
