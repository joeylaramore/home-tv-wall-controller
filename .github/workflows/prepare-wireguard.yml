name: Prepare Roku WireGuard endpoint

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SERVER_HOST: ${{ secrets.SERVER_HOST || secrets.DEPLOY_HOST }}
      SERVER_USER: ${{ secrets.SERVER_USER || 'joey' }}
      SERVER_PORT: ${{ secrets.SERVER_PORT || '22' }}
      SSH_KEY: ${{ secrets.SERVER_SSH_KEY || secrets.DEPLOY_SSH_KEY }}
    steps:
      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$SERVER_PORT" -H "$SERVER_HOST" >> ~/.ssh/known_hosts

      - name: Configure WireGuard and Roku scan network
        shell: bash
        run: |
          set -euo pipefail
          ssh -p "$SERVER_PORT" "$SERVER_USER@$SERVER_HOST" 'sudo bash -se' <<'REMOTE'
          set -euo pipefail
          install -m 700 -d /etc/wireguard
          if [ ! -f /etc/wireguard/roku-wall.conf ]; then
            umask 077
            wg genkey > /etc/wireguard/roku-wall.key
            {
              echo '[Interface]'
              echo 'Address = 10.77.43.1/24'
              echo 'ListenPort = 443'
              printf 'PrivateKey = '
              cat /etc/wireguard/roku-wall.key
            } > /etc/wireguard/roku-wall.conf
            chmod 600 /etc/wireguard/roku-wall.conf
          else
            sed -i 's/^ListenPort = .*/ListenPort = 443/' /etc/wireguard/roku-wall.conf
          fi
          ufw allow 443/udp comment 'Roku WireGuard'
          systemctl restart wg-quick@roku-wall
          ip route replace 192.168.1.0/24 dev roku-wall src 10.77.43.1
          if grep -q '^ROKU_SCAN_CIDRS=' /home/joey/roku-app/.env; then
            sed -i 's#^ROKU_SCAN_CIDRS=.*#ROKU_SCAN_CIDRS=192.168.1.0/24#' /home/joey/roku-app/.env
          else
            echo 'ROKU_SCAN_CIDRS=192.168.1.0/24' >> /home/joey/roku-app/.env
          fi
          cd /home/joey/roku-app
          docker compose up -d --build
          echo 'Route:'
          ip route get 192.168.1.143
          echo 'Testing Roku at 192.168.1.143:'
          curl --max-time 5 http://192.168.1.143:8060/query/device-info || true
          wg show roku-wall
          REMOTE
